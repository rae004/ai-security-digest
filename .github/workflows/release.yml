name: Release

# Releases are cut by the shared workflow in rae004/.github: each push to main
# is one squash-merged PR, and that commit is tagged directly when its
# Conventional Commit type calls for a release (feat -> minor, fix/perf ->
# patch, breaking -> major, anything else -> no release). No release PR, no
# release commit. Rules and docs: https://github.com/rae004/.github#releases
#
# A release then deploys that tag to prod. The `prod` environment's required
# reviewer pauses the deploy until it is approved.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: rae004/.github/.github/workflows/release.yml@fcb16c0e4708e3ba7e0efcfbe2d173a3507e4a65 # v0.2.1

  deploy-prod:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      id-token: write # OIDC token exchange in the called workflow
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
